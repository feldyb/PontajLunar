<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');
  :root{
    --bg:#EDEFE6;
    --surface:#FBFCF8;
    --ink:#22301F;
    --ink-soft:#5B6553;
    --line:#D2D6C7;
    --birou:#9C7A3C;
    --teren:#4F7942;
    --inv:#6E4B36;
    --co:#4A6B8A;
    --accent:#2F4A2A;
    --accent-ink:#F4F6EF;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:440px;margin:0 auto;padding:20px 16px 40px;}

  .name-row{display:flex;align-items:baseline;gap:8px;margin-bottom:18px;}
  .name-row label{font-size:12px;color:var(--ink-soft);}
  .name-row input{border:none;border-bottom:1px solid var(--line);background:transparent;font-family:'Inter';font-size:14px;color:var(--ink);padding:2px 0;flex:1;min-width:0;}
  .name-row input:focus{outline:none;border-bottom-color:var(--accent);}

  .month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .month-nav button{background:none;border:1px solid var(--line);color:var(--ink);width:34px;height:34px;border-radius:4px;font-size:16px;cursor:pointer;}
  .month-nav button:active{background:var(--line);}
  .month-label{font-family:'Fraunces',serif;font-size:22px;font-weight:600;letter-spacing:0.2px;}

  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-bottom:1px;}
  .weekdays div{text-align:center;font-size:11px;color:var(--ink-soft);padding-bottom:4px;}

  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);}
  .cell{background:var(--surface);aspect-ratio:1;position:relative;cursor:pointer;padding:4px;}
  .cell.blank{background:var(--bg);cursor:default;}
  .cell.weekend:not(.blank){background:#F4F5EF;}
  .cell .num{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .cell.today .num{color:var(--accent);font-weight:600;}
  .cell.today::after{content:'';position:absolute;top:3px;right:3px;width:4px;height:4px;border-radius:50%;background:var(--accent);}
  .cell.selected{outline:2px solid var(--accent);outline-offset:-2px;z-index:1;}
  .cell .bar{position:absolute;left:4px;right:4px;bottom:4px;height:4px;border-radius:2px;}
  .cell .ha-tag{position:absolute;bottom:10px;left:4px;right:4px;font-size:9px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}

  .detail{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;}
  .detail .day-label{font-size:13px;color:var(--ink-soft);margin-bottom:10px;}
  .type-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .type-btn{flex:1;min-width:72px;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 6px;font-size:12.5px;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px;justify-content:center;}
  .type-btn .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .type-btn.active{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);}
  .loc-input{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .loc-input label{font-size:12.5px;color:var(--ink-soft);flex-shrink:0;}
  .loc-input input{border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:14px;flex:1;min-width:0;}
  .ha-input{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .ha-input label{font-size:12.5px;color:var(--ink-soft);}
  .ha-input input{border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:14px;width:90px;font-variant-numeric:tabular-nums;}
  .clear-link{margin-top:10px;font-size:12px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;}
  .empty-hint{font-size:13px;color:var(--ink-soft);text-align:center;padding:20px 0;}

  .summary{margin-top:22px;}
  .summary h2{font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin:0 0 10px;}
  .stat-row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .stat-row:last-child{border-bottom:none;}
  .stat-row .val{font-variant-numeric:tabular-nums;font-weight:600;}
  .breakdown{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  .report{margin-top:20px;}
  .report h2{font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin:0 0 10px;}
  .report textarea{width:100%;min-height:118px;border:1px solid var(--line);border-radius:6px;padding:12px;font-family:'Inter';font-size:13px;color:var(--ink);background:var(--surface);resize:vertical;line-height:1.5;}
  .report button{margin-top:8px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:4px;padding:9px 16px;font-size:13.5px;cursor:pointer;}
  .report button:active{opacity:0.85;}
  .copied{font-size:12px;color:var(--teren);margin-left:10px;}

  .export-section{margin-top:20px;}
  .export-section h2{font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin:0 0 6px;}
  .export-hint{font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
  .export-buttons{display:flex;gap:8px;flex-wrap:wrap;}
  .export-buttons button{flex:1;min-width:150px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:9px 12px;font-size:13.5px;cursor:pointer;}
  .export-buttons button:active{background:var(--line);}
  .export-status{font-size:12px;color:var(--ink-soft);margin-top:8px;min-height:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="name-row">
    <label for="nume">Nume</label>
    <input id="nume" type="text" placeholder="opțional">
  </div>

  <div class="month-nav">
    <button id="prevBtn" aria-label="Luna anterioară">‹</button>
    <div class="month-label" id="monthLabel"></div>
    <button id="nextBtn" aria-label="Luna următoare">›</button>
  </div>

  <div class="weekdays">
    <div>L</div><div>M</div><div>M</div><div>J</div><div>V</div><div>S</div><div>D</div>
  </div>
  <div class="grid" id="grid"></div>

  <div class="detail" id="detail" style="display:none;">
    <div class="day-label" id="dayLabel"></div>
    <div class="type-row" id="typeRow"></div>
    <div class="loc-input" id="locRow" style="display:none;">
      <label for="locInput">Loc</label>
      <input id="locInput" type="text" placeholder="ex: UP III, u.a. 45">
    </div>
    <div class="ha-input" id="oreRow" style="display:none;">
      <label for="oreInput">ore lucrate</label>
      <input id="oreInput" type="number" min="0" max="24" step="0.5" inputmode="decimal">
    </div>
    <div class="ha-input" id="haRow" style="display:none;">
      <label for="haInput">ha parcurse</label>
      <input id="haInput" type="number" min="0" step="0.1" inputmode="decimal">
    </div>
    <button class="clear-link" id="clearBtn">Șterge ziua</button>
  </div>
  <div class="empty-hint" id="emptyHint">Atinge o zi din calendar pentru a o completa.</div>

  <div class="summary">
    <h2>Rezumat lună</h2>
    <div class="stat-row"><span>Zile lucrate</span><span class="val" id="sLucrate">0</span></div>
    <div class="breakdown" id="sBreakdown"></div>
    <div class="stat-row"><span>Ore lucrate</span><span class="val" id="sOre">0</span></div>
    <div class="stat-row"><span>Zile CO</span><span class="val" id="sCO">0</span></div>
    <div class="stat-row"><span>Hectare parcurse</span><span class="val" id="sHa">0</span></div>
    <div class="stat-row"><span>Zile inventariere</span><span class="val" id="sInv">0</span></div>
  </div>

  <div class="report">
    <h2>Situație pentru șef</h2>
    <textarea id="reportText" readonly></textarea>
    <button id="copyBtn">Copiază rezumat</button>
    <span class="copied" id="copiedMsg" style="display:none;">Copiat</span>
  </div>

  <div class="export-section">
    <h2>Export tabelar</h2>
    <div class="export-hint">Un rând pe fiecare zi completată: data, tip zi, loc, ha parcurse.</div>
    <div class="export-buttons">
      <button id="exportXlsxBtn">Descarcă Excel (.xlsx)</button>
      <button id="exportPdfBtn">Descarcă PDF (landscape)</button>
    </div>
    <div class="export-status" id="exportStatus"></div>
  </div>
</div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
(function(){
  const TYPES = [
    {key:'birou', label:'Birou', color:'var(--birou)', hasHa:false, hasOre:true},
    {key:'teren', label:'Teren', color:'var(--teren)', hasHa:true, hasOre:true},
    {key:'inventariere', label:'Inventariere', color:'var(--inv)', hasHa:true, hasOre:true},
    {key:'co', label:'CO', color:'var(--co)', hasHa:false, hasOre:false},
  ];
  const MONTHS = ['Ianuarie','Februarie','Martie','Aprilie','Mai','Iunie','Iulie','August','Septembrie','Octombrie','Noiembrie','Decembrie'];
  const WEEKDAY_LONG = ['Luni','Marți','Miercuri','Joi','Vineri','Sâmbătă','Duminică'];
  const WEEKDAY_SHORT = ['L','Ma','Mi','J','V','S','D'];

  const now = new Date();
  let viewYear = now.getFullYear();
  let viewMonth = now.getMonth();
  let monthData = {};
  let selectedDay = null;

  const grid = document.getElementById('grid');
  const monthLabel = document.getElementById('monthLabel');
  const detail = document.getElementById('detail');
  const emptyHint = document.getElementById('emptyHint');
  const dayLabel = document.getElementById('dayLabel');
  const typeRow = document.getElementById('typeRow');
  const locRow = document.getElementById('locRow');
  const locInput = document.getElementById('locInput');
  const oreRow = document.getElementById('oreRow');
  const oreInput = document.getElementById('oreInput');
  const haRow = document.getElementById('haRow');
  const haInput = document.getElementById('haInput');
  const clearBtn = document.getElementById('clearBtn');
  const nameInput = document.getElementById('nume');

  function monthKey(y,m){ return 'pontaj:'+y+'-'+String(m+1).padStart(2,'0'); }
  function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
  function firstWeekdayMon0(y,m){ const d=new Date(y,m,1).getDay(); return (d+6)%7; }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // Foloseste stocarea persistenta a artefactului Claude cand e disponibila
  // (previzualizare in chat); altfel foloseste localStorage, care functioneaza
  // cand fisierul e deschis singur in browser sau impachetat ca APK.
  const hasArtifactStorage = (typeof window.storage !== 'undefined' && typeof window.storage.get === 'function');
  const store = {
    async get(key){
      if(hasArtifactStorage){
        try{ return await window.storage.get(key, false); }catch(e){ return null; }
      }
      try{
        const v = localStorage.getItem(key);
        return v!==null ? {key:key, value:v} : null;
      }catch(e){ return null; }
    },
    async set(key, value){
      if(hasArtifactStorage){
        try{ await window.storage.set(key, value, false); return; }catch(e){ /* continua mai jos */ }
      }
      try{ localStorage.setItem(key, value); }catch(e){ console.error('Salvarea a eșuat', e); }
    }
  };

  async function loadMonth(){
    monthData = {};
    try{
      const res = await store.get(monthKey(viewYear,viewMonth));
      if(res && res.value){ monthData = JSON.parse(res.value); }
    }catch(e){ monthData = {}; }
    selectedDay = null;
    detail.style.display='none';
    emptyHint.style.display='block';
    render();
  }

  async function saveMonth(){
    await store.set(monthKey(viewYear,viewMonth), JSON.stringify(monthData));
  }

  async function loadName(){
    try{
      const res = await store.get('pontaj:nume');
      if(res && res.value){ nameInput.value = res.value; }
    }catch(e){}
  }
  nameInput.addEventListener('change', async function(){
    await store.set('pontaj:nume', nameInput.value);
  });
  nameInput.addEventListener('input', updateReport);

  function render(){
    monthLabel.textContent = MONTHS[viewMonth]+' '+viewYear;
    grid.innerHTML = '';
    const total = daysInMonth(viewYear,viewMonth);
    const lead = firstWeekdayMon0(viewYear,viewMonth);
    for(let i=0;i<lead;i++){
      const c = document.createElement('div');
      c.className='cell blank';
      grid.appendChild(c);
    }
    const todayNum = (viewYear===now.getFullYear() && viewMonth===now.getMonth()) ? now.getDate() : -1;
    for(let d=1; d<=total; d++){
      const cell = document.createElement('div');
      const wd = (lead + d - 1) % 7;
      cell.className='cell'+(wd>=5?' weekend':'')+(d===todayNum?' today':'')+(selectedDay===d?' selected':'');
      const num = document.createElement('div');
      num.className='num'; num.textContent=d;
      cell.appendChild(num);
      const entry = monthData[d];
      if(entry){
        const t = TYPES.find(function(t){return t.key===entry.type;});
        if(t){
          const bar = document.createElement('div');
          bar.className='bar'; bar.style.background=t.color;
          cell.appendChild(bar);
          if(t.hasHa && entry.ha){
            const tag = document.createElement('div');
            tag.className='ha-tag'; tag.textContent=entry.ha+'ha';
            cell.appendChild(tag);
          }
        }
      }
      cell.addEventListener('click', (function(dd){ return function(){ selectDay(dd); }; })(d));
      grid.appendChild(cell);
    }
    updateSummary();
    updateReport();
  }

  function selectDay(d){
    selectedDay = d;
    detail.style.display='block';
    emptyHint.style.display='none';
    const wd = (firstWeekdayMon0(viewYear,viewMonth) + d - 1) % 7;
    dayLabel.textContent = WEEKDAY_LONG[wd]+', '+d+' '+MONTHS[viewMonth].toLowerCase()+' '+viewYear;
    typeRow.innerHTML='';
    const entry = monthData[d];
    TYPES.forEach(function(t){
      const btn = document.createElement('button');
      btn.type='button';
      btn.className='type-btn'+(entry && entry.type===t.key ? ' active':'');
      btn.innerHTML = '<span class="dot" style="background:'+t.color+'"></span>'+t.label;
      btn.addEventListener('click', function(){ setType(d,t.key); });
      typeRow.appendChild(btn);
    });
    if(entry){
      locRow.style.display='flex';
      locInput.value = entry.loc || '';
    } else {
      locRow.style.display='none';
    }
    const t = entry && TYPES.find(function(x){return x.key===entry.type;});
    if(t && t.hasOre){
      oreRow.style.display='flex';
      oreInput.value = entry.ore || '';
    } else {
      oreRow.style.display='none';
    }
    if(t && t.hasHa){
      haRow.style.display='flex';
      haInput.value = entry.ha || '';
    } else {
      haRow.style.display='none';
    }
    renderGridSelection();
  }

  function renderGridSelection(){
    Array.from(grid.children).forEach(function(c){ c.classList.remove('selected'); });
    const lead = firstWeekdayMon0(viewYear,viewMonth);
    if(selectedDay){
      const idx = lead + selectedDay - 1;
      if(grid.children[idx]) grid.children[idx].classList.add('selected');
    }
  }

  function setType(d, key){
    const current = monthData[d];
    if(current && current.type===key){
      delete monthData[d];
    } else {
      const prevHa = current ? current.ha : undefined;
      const prevLoc = current ? current.loc : undefined;
      const prevOre = current ? current.ore : undefined;
      monthData[d] = {type:key};
      const t = TYPES.find(function(x){return x.key===key;});
      if(t.hasHa && prevHa){ monthData[d].ha = prevHa; }
      if(prevLoc){ monthData[d].loc = prevLoc; }
      if(t.hasOre && prevOre){ monthData[d].ore = prevOre; }
    }
    saveMonth();
    render();
    if(monthData[d]){ selectDay(d); }
    else { detail.style.display='none'; emptyHint.style.display='block'; selectedDay=null; }
  }

  locInput.addEventListener('input', function(){
    if(!selectedDay) return;
    const entry = monthData[selectedDay];
    if(!entry) return;
    const v = locInput.value;
    if(v){ entry.loc = v; } else { delete entry.loc; }
    saveMonth();
  });

  oreInput.addEventListener('input', function(){
    if(!selectedDay) return;
    const entry = monthData[selectedDay];
    if(!entry) return;
    const v = parseFloat(oreInput.value);
    if(!isNaN(v) && v>=0){ entry.ore = v; } else { delete entry.ore; }
    saveMonth();
    render();
    renderGridSelection();
  });

  haInput.addEventListener('input', function(){
    if(!selectedDay) return;
    const entry = monthData[selectedDay];
    if(!entry) return;
    const v = parseFloat(haInput.value);
    if(!isNaN(v) && v>=0){ entry.ha = v; } else { delete entry.ha; }
    saveMonth();
    render();
    renderGridSelection();
  });

  clearBtn.addEventListener('click', function(){
    if(!selectedDay) return;
    delete monthData[selectedDay];
    saveMonth();
    detail.style.display='none';
    emptyHint.style.display='block';
    selectedDay=null;
    render();
  });

  function round1(n){ return Math.round(n*10)/10; }

  function tallies(){
    let birou=0, teren=0, inv=0, co=0, ha=0, ore=0;
    Object.keys(monthData).forEach(function(k){
      const e = monthData[k];
      if(e.type==='birou'){ birou++; ore+=e.ore||0; }
      else if(e.type==='teren'){ teren++; ha+=e.ha||0; ore+=e.ore||0; }
      else if(e.type==='inventariere'){ inv++; ha+=e.ha||0; ore+=e.ore||0; }
      else if(e.type==='co') co++;
    });
    return {birou:birou, teren:teren, inv:inv, co:co, ha:round1(ha), ore:round1(ore), lucrate:birou+teren+inv};
  }

  function getRows(){
    const total = daysInMonth(viewYear, viewMonth);
    const lead = firstWeekdayMon0(viewYear, viewMonth);
    const rows = [];
    for(let d=1; d<=total; d++){
      const entry = monthData[d];
      if(!entry) continue;
      const wd = (lead + d - 1) % 7;
      const t = TYPES.find(function(x){return x.key===entry.type;});
      rows.push({
        data: String(d).padStart(2,'0')+'.'+String(viewMonth+1).padStart(2,'0')+'.'+viewYear,
        ziua: WEEKDAY_SHORT[wd],
        tip: t ? t.label : entry.type,
        loc: entry.loc || '',
        ore: (t && t.hasOre && entry.ore) ? entry.ore : '',
        ha: (t && t.hasHa && entry.ha) ? entry.ha : ''
      });
    }
    return rows;
  }

  function updateSummary(){
    const s = tallies();
    document.getElementById('sLucrate').textContent = s.lucrate;
    document.getElementById('sBreakdown').textContent = 'birou '+s.birou+' · teren '+s.teren+' · inventariere '+s.inv;
    document.getElementById('sOre').textContent = s.ore;
    document.getElementById('sCO').textContent = s.co;
    document.getElementById('sHa').textContent = s.ha;
    document.getElementById('sInv').textContent = s.inv;
  }

  function updateReport(){
    const s = tallies();
    const name = nameInput.value.trim();
    const lines = [];
    lines.push(MONTHS[viewMonth]+' '+viewYear+(name? ' — '+name : ''));
    lines.push('Zile lucrate: '+s.lucrate+' (birou '+s.birou+', teren '+s.teren+', inventariere '+s.inv+')');
    lines.push('Ore lucrate: '+s.ore);
    lines.push('Zile concediu (CO): '+s.co);
    lines.push('Hectare parcurse: '+s.ha);
    lines.push('Zile inventariere: '+s.inv);
    document.getElementById('reportText').value = lines.join('\n');
  }

  function setStatus(msg){
    const el = document.getElementById('exportStatus');
    el.textContent = msg;
    if(msg){ setTimeout(function(){ if(el.textContent===msg) el.textContent=''; }, 4000); }
  }

  function exportExcel(){
    if(typeof XLSX === 'undefined'){ setStatus('Biblioteca Excel se încarcă, mai încearcă în câteva secunde.'); return; }
    const rows = getRows();
    if(rows.length===0){ setStatus('Nu ai nicio zi completată în luna curentă.'); return; }
    const s = tallies();
    const name = nameInput.value.trim();
    const header = ['Data','Ziua','Tip zi','Loc','Ore','Ha parcurse'];
    const data = [header];
    rows.forEach(function(r){ data.push([r.data, r.ziua, r.tip, r.loc, r.ore, r.ha]); });
    data.push([]);
    data.push(['Zile lucrate', s.lucrate]);
    data.push(['  din care birou', s.birou]);
    data.push(['  din care teren', s.teren]);
    data.push(['  din care inventariere', s.inv]);
    data.push(['Ore lucrate', s.ore]);
    data.push(['Zile CO', s.co]);
    data.push(['Hectare parcurse', s.ha]);
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws['!cols'] = [{wch:12},{wch:6},{wch:14},{wch:30},{wch:8},{wch:13}];
    const wb = XLSX.utils.book_new();
    const sheetName = (MONTHS[viewMonth]+' '+viewYear).slice(0,31);
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
    const fname = 'Pontaj_'+MONTHS[viewMonth]+'_'+viewYear+(name?'_'+name.replace(/\s+/g,'_'):'')+'.xlsx';
    XLSX.writeFile(wb, fname);
    setStatus('Excel descărcat.');
  }

  async function exportPDF(){
    if(typeof window.jspdf === 'undefined' || typeof html2canvas === 'undefined'){
      setStatus('Bibliotecile se încarcă, mai încearcă în câteva secunde.');
      return;
    }
    const rows = getRows();
    if(rows.length===0){ setStatus('Nu ai nicio zi completată în luna curentă.'); return; }
    setStatus('Se generează PDF...');
    const s = tallies();
    const name = nameInput.value.trim();
    const title = 'Pontaj lunar — '+MONTHS[viewMonth]+' '+viewYear+(name?' — '+escapeHtml(name):'');

    const container = document.createElement('div');
    container.style.position='fixed';
    container.style.left='-99999px';
    container.style.top='0';
    container.style.background='#FFFFFF';
    container.style.padding='24px';
    container.style.width='1100px';
    container.style.fontFamily="'Inter', sans-serif";
    container.style.color='#22301F';

    const rowsHtml = rows.map(function(r){
      return '<tr>'
        +'<td style="padding:6px 8px;border:1px solid #D2D6C7;">'+escapeHtml(r.data)+'</td>'
        +'<td style="padding:6px 8px;border:1px solid #D2D6C7;">'+escapeHtml(r.ziua)+'</td>'
        +'<td style="padding:6px 8px;border:1px solid #D2D6C7;">'+escapeHtml(r.tip)+'</td>'
        +'<td style="padding:6px 8px;border:1px solid #D2D6C7;">'+escapeHtml(r.loc)+'</td>'
        +'<td style="padding:6px 8px;border:1px solid #D2D6C7;text-align:right;">'+(r.ore!==''? r.ore : '—')+'</td>'
        +'<td style="padding:6px 8px;border:1px solid #D2D6C7;text-align:right;">'+(r.ha!==''? r.ha : '—')+'</td>'
        +'</tr>';
    }).join('');

    container.innerHTML =
      '<div style="font-family:\'Fraunces\',serif;font-size:22px;font-weight:600;margin-bottom:16px;">'+title+'</div>'
      +'<table style="border-collapse:collapse;width:100%;font-size:13px;">'
      +'<thead><tr>'
      +'<th style="padding:6px 8px;border:1px solid #D2D6C7;text-align:left;background:#EDEFE6;">Data</th>'
      +'<th style="padding:6px 8px;border:1px solid #D2D6C7;text-align:left;background:#EDEFE6;">Ziua</th>'
      +'<th style="padding:6px 8px;border:1px solid #D2D6C7;text-align:left;background:#EDEFE6;">Tip zi</th>'
      +'<th style="padding:6px 8px;border:1px solid #D2D6C7;text-align:left;background:#EDEFE6;">Loc</th>'
      +'<th style="padding:6px 8px;border:1px solid #D2D6C7;text-align:right;background:#EDEFE6;">Ore</th>'
      +'<th style="padding:6px 8px;border:1px solid #D2D6C7;text-align:right;background:#EDEFE6;">Ha parcurse</th>'
      +'</tr></thead><tbody>'+rowsHtml+'</tbody></table>'
      +'<div style="margin-top:18px;font-size:14px;line-height:1.7;">'
      +'<div><strong>Zile lucrate:</strong> '+s.lucrate+' (birou '+s.birou+', teren '+s.teren+', inventariere '+s.inv+')</div>'
      +'<div><strong>Ore lucrate:</strong> '+s.ore+'</div>'
      +'<div><strong>Zile CO:</strong> '+s.co+'</div>'
      +'<div><strong>Hectare parcurse:</strong> '+s.ha+'</div>'
      +'</div>';

    document.body.appendChild(container);
    try{
      const canvas = await html2canvas(container, {scale:2, backgroundColor:'#FFFFFF'});
      const jsPDFCtor = window.jspdf.jsPDF;
      const doc = new jsPDFCtor({orientation:'landscape', unit:'mm', format:'a4'});
      const pageW = doc.internal.pageSize.getWidth();
      const pageH = doc.internal.pageSize.getHeight();
      const margin = 10;
      const maxW = pageW - margin*2;
      const maxH = pageH - margin*2;
      let imgW = maxW;
      let imgH = imgW * canvas.height / canvas.width;
      if(imgH > maxH){ imgH = maxH; imgW = imgH * canvas.width / canvas.height; }
      const x = (pageW - imgW)/2;
      const y = margin;
      doc.addImage(canvas.toDataURL('image/png'), 'PNG', x, y, imgW, imgH);
      const fname = 'Pontaj_'+MONTHS[viewMonth]+'_'+viewYear+(name?'_'+name.replace(/\s+/g,'_'):'')+'.pdf';
      doc.save(fname);
      setStatus('PDF descărcat.');
    }catch(e){
      console.error(e);
      setStatus('Generarea PDF-ului a eșuat.');
    }finally{
      document.body.removeChild(container);
    }
  }

  document.getElementById('exportXlsxBtn').addEventListener('click', exportExcel);
  document.getElementById('exportPdfBtn').addEventListener('click', exportPDF);

  document.getElementById('prevBtn').addEventListener('click', function(){
    viewMonth--; if(viewMonth<0){viewMonth=11; viewYear--;}
    loadMonth();
  });
  document.getElementById('nextBtn').addEventListener('click', function(){
    viewMonth++; if(viewMonth>11){viewMonth=0; viewYear++;}
    loadMonth();
  });

  document.getElementById('copyBtn').addEventListener('click', async function(){
    const txt = document.getElementById('reportText').value;
    const msg = document.getElementById('copiedMsg');
    try{
      await navigator.clipboard.writeText(txt);
    }catch(e){
      const ta = document.getElementById('reportText');
      ta.select();
      try{ document.execCommand('copy'); }catch(e2){}
    }
    msg.style.display='inline';
    setTimeout(function(){ msg.style.display='none'; }, 1500);
  });

  loadName();
  loadMonth();

  if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
    navigator.serviceWorker.register('sw.js').catch(function(e){ console.warn('Înregistrarea service worker a eșuat', e); });
  }
})();
</script>
</body>
</html>
